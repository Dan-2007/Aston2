# Spring Boot application configuration
# Default profile: PostgreSQL datasource + JPA settings
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/userdb
    username: dbuser
    password: dbuser
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update      # use 'validate' or 'none' in production if schema is managed separately
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
    listener:
      missing-topics-fatal: false


  mail:
    host: localhost
    port: 25
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

notification:
  topic: users.events
server:
  port: 8080

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.example.task4_1: DEBUG
